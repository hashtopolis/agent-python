name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-tests.txt
      - name: Run unit tests
        run: >
          python -m pytest tests
          --deselect tests/test_hashcat_simple.py::HashcatSimple::test_simple_linux
          --deselect tests/test_hashcat_files.py::HashcatFiles::test_files_linux
          --deselect tests/test_hashcat_brain.py::HashcatBrain::test_brain_linux
          --deselect tests/test_hashcat_files_7z.py::HashcatFiles7z::test_files_7z_linux
          --deselect tests/test_hashcat_preprocessor.py::HashcatPreprocessor::test_preprocessor_linux
          -v
